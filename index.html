<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz do Rafa</title>
  <style>
    body {
      font-family: 'Trebuchet MS', sans-serif;
      margin: 0;
      padding: 20px;
      background-image: url('https://www.rtp.pt/wportal/imagens/programas/84/quem_quer_ser_milionario.jpg');
      background-size: cover;
      background-position: center;
      color: #f4c430;
      text-shadow: 1px 1px 2px black;
    }
    h1 {
      text-align: center;
      font-size: 32px;
      color: #f4c430;
      text-shadow: 2px 2px 4px black;
    }
    .question {
      margin-bottom: 20px;
      background-color: rgba(0, 0, 51, 0.85);
      padding: 15px;
      border-radius: 10px;
      border: 2px solid #f4c430;
    }
    .answers button {
      display: block;
      margin: 10px 0;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: 2px solid #f4c430;
      background-color: #001f4d;
      color: #f4c430;
      transition: all 0.3s;
    }
    .answers button:hover {
      background-color: #f4c430;
      color: #001f4d;
    }
    .correct {
      background-color: #4CAF50 !important;
      color: white !important;
    }
    .incorrect {
      background-color: #f44336 !important;
      color: white !important;
    }
    #result {
      font-size: 22px;
      margin-top: 30px;
      font-weight: bold;
      text-align: center;
      color: white;
    }
    .share-button {
      margin-top: 20px;
      background-color: #25D366;
      color: white;
      padding: 12px;
      border: none;
      width: 100%;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Quiz: Quanto sabes sobre o Rafa?</h1>
  <div id="quiz"></div>
  <div id="result"></div>
  <button class="share-button" onclick="shareResult()" style="display:none">Partilhar no WhatsApp</button>

  <script>
    const quizData = [
      { question: "Viagem de sonho que gostava de fazer seria o Japão.", correct: "Japão", options: ["Brasil", "Dubai", "Maldivas"] },
      { question: "Cor favorita é o laranja.", correct: "laranja", options: ["azul", "Verde", "Cinza"] },
      { question: "Se só pudesse comer uma comida para o resto da vida seria:", correct: "picanha", options: ["Francesinha", "Panados com arroz branco", "Carne de porco à alentejana"] },
      { question: "O primeiro nome que tive na minha camisola de futebol no Bairro FC era:", correct: "R. Soares", options: ["Rafa", "R. Faria", "Soares"] },
      { question: "Quando comecei a trabalhar na ERA?", correct: "15 de abril de 2021", options: ["15 de abril de 2022", "15 de Janiero de 2022", "15 de janeiro 2021"] },
      { question: "O meu carro de sonho é o:", correct: "Porsche 912 GT3 RS", options: ["Lamborghini", "Audi RS5 dos novos", "Ferrari 574"] },
      { question: "Quem era o melhor amigo do Rafa no externato?", correct: "Trina", options: ["Darja", "Bruno", "Isolino"] },
      { question: "Qual a música que o Rafa estava a tentar cantar no mítico vídeo do 'Faltou-me as palavras'?", correct: "Brilhantes diamantes - Maze", options: ["Verão Azul - D'zrt", "Namorada - Angêlico vieira", "Sabemos onde vamos - Mundo secreto"] },
      { question: "Qual o nome do chalet onde trabalhou o Rafa na Suíça?", correct: "Hakuna", options: ["Matata", "Hakuna Matata", "Maison Stroll"] },
      { question: "Qual a bebida favorita do Rafa?", correct: "Água", options: ["Sumol de laranja", "Leite chocolatado Mimosa Magro", "Compal Manga laranja"] },
      { question: "Em que dia nasceu o único sobrinho do Rafa?", correct: "23 de Outubro", options: ["22 de Outubro", "23 de Novembro", "21 de Setembro"] },
      { question: "Em que dia começou o Rafa a viver em Vila das Aves?", correct: "21 de Outubro de 2023", options: ["21 de outubro de 2022", "20 de Outubro de 2023", "20 de Setembro de 2022"] },
      { question: "Qual a primeira consola que o Rafa teve?", correct: "PS1", options: ["PS2", "PS3", "PSP"] },
      { question: "Quanto calça o Rafa?", correct: "41", options: ["40", "42", "42,5"] },
      { question: "Quantas respostas erradas teve o Rafa no exame de código?", correct: "1", options: ["0", "2", "3"] },
    ];

    let currentQuestion = 0;
    let score = 0;

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function loadQuestion() {
      const container = document.getElementById('quiz');
      container.innerHTML = '';

      if (currentQuestion >= quizData.length) {
        document.getElementById('result').textContent = `Acertaste ${score} em ${quizData.length} perguntas!`;
        document.querySelector('.share-button').style.display = 'block';
        return;
      }

      const q = quizData[currentQuestion];
      const allAnswers = shuffle([q.correct, ...q.options]);

      const qEl = document.createElement('div');
      qEl.className = 'question';
      qEl.innerHTML = `<h3>${currentQuestion + 1}. ${q.question}</h3>`;

      const answersEl = document.createElement('div');
      answersEl.className = 'answers';

      allAnswers.forEach(answer => {
        const btn = document.createElement('button');
        btn.textContent = answer;
        btn.onclick = () => {
          if (answer === q.correct) {
            btn.classList.add('correct');
            score++;
          } else {
            btn.classList.add('incorrect');
            Array.from(answersEl.children).forEach(b => {
              if (b.textContent === q.correct) {
                b.classList.add('correct');
              }
            });
          }

          Array.from(answersEl.children).forEach(b => b.disabled = true);
          setTimeout(() => {
            currentQuestion++;
            loadQuestion();
          }, 1500);
        };
        answersEl.appendChild(btn);
      });

      container.appendChild(qEl);
      container.appendChild(answersEl);
    }

    function shareResult() {
      const text = `Acabei o quiz do Rafa e acertei ${score} em ${quizData.length} perguntas! Consegues bater-me?`; 
      const url = encodeURIComponent(window.location.href);
      const shareUrl = `https://wa.me/?text=${encodeURIComponent(text)}%20${url}`;
      window.open(shareUrl, '_blank');
    }

    loadQuestion();
  </script>
</body>
</html>
